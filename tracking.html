<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Tracking — Priya &amp; Gautam</title>
  <meta name="description" content="Private RSVP tracking dashboard." />
  <link rel="icon" type="image/x-icon" href="media/wedding_logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap"
    rel="stylesheet" />

  <style>
    /* ── RESET & TOKENS ────────────────────────────────────── */
    :root {
      --bg: #FAF9F6;
      --bg-card: #ffffff;
      --gold: #c4a96a;
      --gold-light: #dcc288;
      --green: #2f5233;
      --green-deep: #1e3622;
      --green-soft: #e8f0e9;
      --text: #1a1814;
      --text-mid: #4a4540;
      --text-muted: #7a7060;
      --border: rgba(0, 0, 0, 0.08);
      --accepted: #3d8b5f;
      --declined: #c45c5c;
      --awaiting: #d4a843;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.06), 0 8px 32px rgba(0, 0, 0, 0.04);
      --radius: 12px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* ── PASSWORD GATE ─────────────────────────────────────── */
    #password-gate {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #password-gate.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .gate-card {
      text-align: center;
      padding: 48px 40px;
      max-width: 400px;
      width: 90%;
    }

    .gate-ornament {
      width: 60px;
      height: auto;
      margin-bottom: 16px;
    }

    .gate-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-style: italic;
      font-size: 36px;
      color: var(--green);
      margin-bottom: 8px;
    }

    .gate-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .gate-input-wrap {
      position: relative;
      margin-bottom: 16px;
    }

    .gate-input {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      font-family: 'Montserrat', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--text);
      text-align: center;
      letter-spacing: 0.08em;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .gate-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(196, 169, 106, 0.12);
    }

    .gate-input.error {
      border-color: var(--declined);
      animation: shake 0.4s ease;
    }

    .gate-btn {
      width: 100%;
      padding: 14px 24px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    .gate-btn:hover {
      background: var(--green-deep);
      transform: translateY(-1px);
    }

    .gate-error-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      color: var(--declined);
      margin-top: 12px;
      min-height: 18px;
    }

    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      20% {
        transform: translateX(-6px);
      }

      40% {
        transform: translateX(6px);
      }

      60% {
        transform: translateX(-4px);
      }

      80% {
        transform: translateX(4px);
      }
    }

    /* ── LOADING STATE ─────────────────────────────────────── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: var(--bg);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 20px;
    }

    #loading-overlay.show {
      display: flex;
    }

    .loading-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ── DASHBOARD CONTAINER ───────────────────────────────── */
    #dashboard {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      animation: fadeIn 0.6s ease;
    }

    #dashboard.show {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── PAGE HEADER ───────────────────────────────────────── */
    .dash-header {
      text-align: center;
      margin-bottom: 48px;
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border);
    }

    .dash-header-ornament {
      width: 50px;
      height: auto;
      margin-bottom: 12px;
    }

    .dash-title {
      font-weight: 600;
      font-size: clamp(32px, 5vw, 48px);
      color: var(--green);
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .dash-subtitle {
      font-style: italic;
      font-size: clamp(14px, 2.5vw, 18px);
      color: var(--text-muted);
    }

    .dash-last-updated {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-top: 12px;
      text-transform: uppercase;
    }

    /* ── EVENT CARD ─────────────────────────────────────────── */
    .event-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px 32px;
      margin-bottom: 20px;
      transition: box-shadow 0.3s ease;
    }

    .event-card:hover {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 12px 40px rgba(0, 0, 0, 0.05);
    }

    .event-card.overview-card {
      border: 1.5px solid rgba(196, 169, 106, 0.35);
      background: linear-gradient(135deg, #faf9f6 0%, #f5f0e8 100%);
      margin-bottom: 36px;
    }

    .event-card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .event-name {
      font-weight: 600;
      font-size: clamp(22px, 4vw, 30px);
      color: var(--green);
      letter-spacing: 0.03em;
    }

    .event-label-tag {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(196, 169, 106, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
    }

    /* ── STAT CHIPS ─────────────────────────────────────────── */
    .stat-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
      user-select: none;
    }

    .stat-chip:hover {
      transform: translateY(-1px);
    }

    .stat-chip.active {
      border-color: currentColor;
    }

    .stat-chip[data-type="invited"] {
      color: var(--text-mid);
    }

    .stat-chip[data-type="invited"]:hover,
    .stat-chip[data-type="invited"].active {
      background: rgba(74, 69, 64, 0.06);
    }

    .stat-chip[data-type="accepted"] {
      color: var(--accepted);
    }

    .stat-chip[data-type="accepted"]:hover,
    .stat-chip[data-type="accepted"].active {
      background: rgba(61, 139, 95, 0.08);
    }

    .stat-chip[data-type="declined"] {
      color: var(--declined);
    }

    .stat-chip[data-type="declined"]:hover,
    .stat-chip[data-type="declined"].active {
      background: rgba(196, 92, 92, 0.08);
    }

    .stat-chip[data-type="awaiting"] {
      color: var(--awaiting);
    }

    .stat-chip[data-type="awaiting"]:hover,
    .stat-chip[data-type="awaiting"].active {
      background: rgba(212, 168, 67, 0.08);
    }

    .stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
    }

    .stat-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    .stat-count {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 15px;
    }

    /* ── THERMOMETER BAR ───────────────────────────────────── */
    .thermo-wrap {
      margin-bottom: 8px;
    }

    .thermo-bar {
      display: flex;
      height: 28px;
      border-radius: 14px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.04);
    }

    .thermo-seg {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: filter 0.25s ease, flex 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      min-width: 0;
    }

    .thermo-seg:hover {
      filter: brightness(1.08);
    }

    .thermo-seg.seg-accepted {
      background: var(--accepted);
    }

    .thermo-seg.seg-declined {
      background: var(--declined);
    }

    .thermo-seg.seg-awaiting {
      background: var(--awaiting);
    }

    .thermo-seg-label {
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      font-size: 11px;
      color: #fff;
      pointer-events: none;
      white-space: nowrap;
    }

    /* ── NAME LIST (expandable) ─────────────────────────────── */
    .name-list-wrap {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s ease;
    }

    .name-list-wrap.open {
      max-height: 360px;
      overflow-y: auto;
      padding-top: 12px;
      /* Subtle scrollbar styling */
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    }

    .name-list-wrap.open::-webkit-scrollbar {
      width: 4px;
    }

    .name-list-wrap.open::-webkit-scrollbar-track {
      background: transparent;
    }

    .name-list-wrap.open::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.15);
      border-radius: 2px;
    }

    .name-list-header {
      font-family: 'Montserrat', sans-serif;
      font-weight: 500;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name-list-header .header-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .name-list {
      columns: 3 180px;
      column-gap: 24px;
    }

    .name-tag {
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
      font-size: 12px;
      color: var(--text-mid);
      padding: 3px 0;
      display: block;
      break-inside: avoid;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── PERSON SEARCH ──────────────────────────────────────── */
    .search-section {
      margin-bottom: 36px;
    }

    .search-input-wrap {
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      width: 16px;
      height: 16px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px 14px 44px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0.04em;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      box-shadow: var(--shadow);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(196, 169, 106, 0.12), var(--shadow);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .search-results {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .person-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px 24px;
      animation: fadeIn 0.25s ease;
    }

    .person-card-party-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(196, 169, 106, 0.1);
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    /* Horizontal scroll wrapper (mobile) */
    .attendance-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(0,0,0,0.12) transparent;
    }
    .attendance-scroll::-webkit-scrollbar { height: 4px; }
    .attendance-scroll::-webkit-scrollbar-track { background: transparent; }
    .attendance-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 2px; }

    /* The grid table itself */
    .attendance-table {
      border-collapse: collapse;
      width: 100%;
      min-width: 360px; /* forces scroll on very narrow screens */
    }

    /* Event name column (left) */
    .att-event-cell {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.03em;
      padding: 7px 14px 7px 0;
      white-space: nowrap;
      border-bottom: 1px solid var(--border);
      text-align: left;
      min-width: 130px;
    }
    .att-event-cell.last-row { border-bottom: none; }

    /* Member name column headers */
    .att-name-header {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--green);
      letter-spacing: 0.03em;
      padding: 0 16px 12px;
      text-align: center;
      white-space: nowrap;
      border-bottom: 2px solid rgba(196,169,106,0.25);
    }

    /* Status icon cells */
    .att-cell {
      text-align: center;
      padding: 7px 16px;
      border-bottom: 1px solid var(--border);
    }
    .att-cell.last-row { border-bottom: none; }

    /* SVG icons inside cells */
    .att-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .att-icon.accepted { background: rgba(61,139,95,0.12); }
    .att-icon.declined { background: rgba(196,92,92,0.12); }
    .att-icon.awaiting { background: rgba(212,168,67,0.1); }
    .att-icon.not-invited { background: rgba(0,0,0,0.04); }

    .search-no-results {
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 300;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-align: center;
      padding: 20px 0 8px;
    }

    /* ── SORT BUTTONS ──────────────────────────────────────────── */
    .sort-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    .sort-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .sort-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px 10px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }

    .sort-btn:hover {
      background: rgba(0,0,0,0.04);
      color: var(--text);
    }

    .sort-btn.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    /* ── VIEW TAB BAR ───────────────────────────────────────── */
    #view-tab-bar {
      display: none;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0;
    }

    .view-tab-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 10px 20px;
      margin-bottom: -1px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }

    .view-tab-btn:hover { color: var(--text); }

    .view-tab-btn.active {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── ACCOMMODATIONS PANEL ───────────────────────────── */
    .accom-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease;
    }

    .accom-card-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 22px;
      color: var(--text);
      letter-spacing: 0.04em;
      margin-bottom: 18px;
    }

    /* Song Requests */
    .song-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 28px;
      animation: fadeIn 0.25s ease;
    }

    .song-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 22px;
      color: var(--gold);
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }

    .song-section-subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-row {
      display: flex;
      gap: 14px;
      align-items: baseline;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .song-row:last-child { border-bottom: none; }

    .song-guest-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      min-width: 160px;
      white-space: nowrap;
    }

    .song-request-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    /* ── GROUP FILTER BAR ─────────────────────────────────────── */
    #group-filter-bar {
      display: none; /* shown after data loads */
      margin-bottom: 28px;
    }

    .gf-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .gf-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .gf-pill {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.06em;
      color: var(--text-mid);
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 5px 14px;
      cursor: pointer;
      transition: background 0.2s, color 0.2s, border-color 0.2s, opacity 0.2s;
      white-space: nowrap;
      user-select: none;
    }

    .gf-pill:hover { background: rgba(0,0,0,0.04); }

    .gf-pill.active {
      background: var(--green);
      color: #fff;
      border-color: var(--green);
    }

    .gf-pill.gf-all {
      font-weight: 500;
      border-style: dashed;
    }

    /* ── GROUP HEADER inside name lists ────────────────────── */
    .group-header {
      font-family: 'Montserrat', sans-serif;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      padding-top: 10px;
      padding-bottom: 2px;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(196,169,106,0.2);
      break-inside: avoid;
      break-after: avoid;
      column-span: all;   /* spans all columns — always pinned to the left edge */
      display: block;
    }
    .group-header:first-child { padding-top: 0; }

    /* ── ALLERGY SECTION ─────────────────────────────────────── */
    .allergy-section {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
    }

    .allergy-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .allergy-header-label {
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .allergy-count-tag {
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(196,92,92,0.1);
      color: var(--declined);
    }

    .allergy-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .allergy-row {
      display: flex;
      gap: 12px;
      align-items: baseline;
      padding: 3px 0;
    }

    .allergy-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
      min-width: 140px;
    }

    .allergy-details {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 400;
      color: var(--text-mid);
      letter-spacing: 0.03em;
      line-height: 1.5;
    }

    .allergy-tag {
      display: inline-block;
      background: rgba(196,92,92,0.1);
      color: var(--declined);
      font-family: 'Montserrat', sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 999px;
      margin-right: 4px;
    }

    .allergy-none {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 300;
      font-style: italic;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      padding: 4px 2px;
    }

    /* ── RESPONSIVE ─────────────────────────────────────────── */
    @media (max-width: 600px) {
      #dashboard {
        padding: 24px 16px 60px;
      }

      .event-card {
        padding: 20px 18px;
      }

      .stat-row {
        gap: 8px;
      }

      .stat-chip {
        padding: 6px 10px;
        gap: 6px;
      }

      .stat-count {
        font-size: 13px;
      }

      .stat-label {
        font-size: 10px;
      }

      .thermo-bar {
        height: 24px;
      }

      .thermo-seg-label {
        font-size: 10px;
      }

      .person-events-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
  </style>
  <script>

<body>

  <!-- ── Password Gate ─────────────────────────────────────── -->
  <div id="password-gate">
    <div class="gate-card">
      <svg class="gate-ornament" viewBox="0 0 80 20" fill="none" stroke="rgba(196,169,106,0.6)" stroke-width="0.8"
        stroke-linecap="round">
        <line x1="0" y1="10" x2="26" y2="10" />
        <circle cx="40" cy="10" r="3" fill="none" />
        <line x1="54" y1="10" x2="80" y2="10" />
      </svg>
      <h1 class="gate-title">RSVP Tracking</h1>
      <p class="gate-subtitle">Private Dashboard</p>
      <form id="gate-form">
        <div class="gate-input-wrap">
          <input type="password" id="gate-password" class="gate-input" placeholder="Enter password"
            autocomplete="off" />
        </div>
        <button type="submit" class="gate-btn">View Dashboard</button>
        <p id="gate-error" class="gate-error-text" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- ── Loading Overlay ───────────────────────────────────── -->
  <div id="loading-overlay">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading RSVP data…</p>
  </div>

  <!-- ── Dashboard ─────────────────────────────────────────── -->
  <div id="dashboard">
    <header class="dash-header">
      <svg class="dash-header-ornament" viewBox="0 0 80 20" fill="none" stroke="rgba(196,169,106,0.5)"
        stroke-width="0.8" stroke-linecap="round">
        <line x1="0" y1="10" x2="26" y2="10" />
        <circle cx="40" cy="10" r="3" fill="none" />
        <line x1="54" y1="10" x2="80" y2="10" />
      </svg>
      <h1 class="dash-title">RSVP Dashboard</h1>
      <p class="dash-subtitle">Priya &amp; Gautam's Wedding</p>
      <p class="dash-last-updated" id="last-updated"></p>
    </header>
    <!-- ── Person Search ───────────────────────────────────── -->
    <section class="search-section" id="search-section" style="display:none">
      <div class="search-input-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="search"
          id="person-search"
          class="search-input"
          placeholder="Search for a guest…"
          autocomplete="off"
          spellcheck="false"
        />
      </div>
      <div class="search-results" id="search-results"></div>
    </section>

    <!-- ── Group Filter Bar ──────────────────────────────── -->
    <div id="group-filter-bar"></div>

    <!-- ── View Tab Bar ─────────────────────────────────── -->
    <div id="view-tab-bar">
      <button class="view-tab-btn active" data-view="rsvp">RSVP Responses</button>
      <button class="view-tab-btn" data-view="accommodations">Accommodations</button>
    </div>

    <!-- RSVP tab -->
    <div id="rsvp-panel" class="tab-panel active">
      <div id="cards-container"></div>
    </div>

    <!-- Accommodations tab -->
    <div id="accommodations-panel" class="tab-panel">
      <div id="accommodations-container"></div>
    </div>

  </div>

  <script>
    /* ============================================================
       TRACKING DASHBOARD — Inline JS
       ============================================================ */

    const API_URL = 'https://script.google.com/macros/s/AKfycbwJJOaKdTIcPv9ZdqX44sgSbYeUPF4Lu6OuOPM28Kfva7LJZ_eLjj-yrlROV2h0dniv/exec';

    // Event definitions: CSV column prefix → display name
    const EVENTS = [
      { inviteCol: 'Ganesh Puja Invite', responseCol: 'Ganesh Puja Response', name: 'Ganesh Puja' },
      { inviteCol: 'Haldi Invite', responseCol: 'Haldi Response', name: 'Haldi' },
      { inviteCol: 'Sangeet Invite', responseCol: 'Sangeet Response', name: 'Sangeet' },
      { inviteCol: 'Wedding Invite', responseCol: 'Wedding Response', name: 'Wedding' },
      { inviteCol: 'Reception Invite', responseCol: 'Reception Response', name: 'Reception' },
      { inviteCol: 'Satya Puja Invite', responseCol: 'Satya Puja Response', name: 'Satyanārāyaṇa Puja' },
      { inviteCol: 'Balaji Kalyanam Invite', responseCol: 'Balaji Kalyanam Response', name: 'Balaji Kalyanam' },
    ];

    // ── Password Gate ───────────────────────────────────────
    const gateEl = document.getElementById('password-gate');
    const gateForm = document.getElementById('gate-form');
    const gatePwd = document.getElementById('gate-password');
    const gateError = document.getElementById('gate-error');
    const loadingOverlay = document.getElementById('loading-overlay');
    const dashboard = document.getElementById('dashboard');
    const cardsContainer = document.getElementById('cards-container');

    gateForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = gatePwd.value.trim().toLowerCase();
      if (!pwd) {
        gatePwd.classList.add('error');
        gateError.textContent = 'Please enter the password.';
        setTimeout(() => gatePwd.classList.remove('error'), 400);
        return;
      }

      // Hide gate, show loading
      gateEl.classList.add('hidden');
      loadingOverlay.classList.add('show');

      try {
        const data = await fetchTrackingData(pwd);
        if (!data.success) {
          throw new Error(data.error || 'Failed to load data');
        }
        renderDashboard(data.guests);
        loadingOverlay.classList.remove('show');
        dashboard.classList.add('show');
      } catch (err) {
        loadingOverlay.classList.remove('show');
        gateEl.classList.remove('hidden');
        gatePwd.classList.add('error');
        gateError.textContent = err.message === 'Invalid password'
          ? 'Incorrect password. Please try again.'
          : 'Error loading data. Please try again.';
        setTimeout(() => gatePwd.classList.remove('error'), 400);
        gatePwd.value = '';
        gatePwd.focus();
      }
    });

    // ── Fetch Data ──────────────────────────────────────────
    async function fetchTrackingData(pwd) {
      // Try POST first, fall back to GET for CORS
      try {
        const resp = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'tracking', pwd }),
          redirect: 'follow'
        });
        return await resp.json();
      } catch (_) {
        const url = `${API_URL}?action=tracking&pwd=${encodeURIComponent(pwd)}`;
        const resp = await fetch(url, { redirect: 'follow' });
        return await resp.json();
      }
    }

    // ── Aggregate Data ──────────────────────────────────────
    // Each list now holds rich objects: { name, status, idx }
    // status = 'accepted' | 'declined' | 'awaiting'
    // idx    = original position in allGuests (= sheet order)

    // Case-insensitive field finder — exact first, then substring fallback
    function getField(guest, ...candidates) {
      const keys = Object.keys(guest);
      // Pass 1: exact normalized match
      for (const key of keys) {
        const norm = key.toLowerCase().replace(/[^a-z0-9]/g, '');
        for (const c of candidates) {
          if (norm === c.toLowerCase().replace(/[^a-z0-9]/g, '')) return (guest[key] || '').trim();
        }
      }
      // Pass 2: substring match (catches columns like "Allergy?", "Has Nut Allergy", etc.)
      for (const key of keys) {
        const norm = key.toLowerCase();
        for (const c of candidates) {
          if (norm.includes(c.toLowerCase().split(' ')[0])) {
            const val = (guest[key] || '').trim();
            if (val) return val;
          }
        }
      }
      return '';
    }

    function aggregateEvent(guests, event) {
      const invited  = [];
      const accepted = [];
      const declined = [];
      const awaiting = [];
      const allergies = [];

      for (let i = 0; i < guests.length; i++) {
        const g    = guests[i];
        const inv  = g[event.inviteCol];
        const res  = g[event.responseCol];
        const name = g['display name'] || 'Unknown';
        const group = getField(g, 'group') || 'Uncategorized';

        if (inv !== '1') continue;

        let status;
        if (res === '-') continue;
        if (res === '1')      status = 'accepted';
        else if (res === '0') status = 'declined';
        else                  status = 'awaiting';

        const item = { name, status, idx: i, group };
        invited.push(item);
        if (status === 'accepted') {
          accepted.push(item);
          const nutAllergy = getField(g, 'nut allergy', 'nutallergy', 'nut allergy?');
          const dietary    = getField(g, 'dietary restrictions', 'dietary', 'dietaryrestrictions', 'food');
          allergies.push({ name, nutAllergy, dietary });
        } else if (status === 'declined') declined.push(item);
        else awaiting.push(item);
      }

      return { invited, accepted, declined, awaiting, allergies };
    }

    // ── Global state ────────────────────────────────────────
    let allGuests    = [];
    let allGroups    = [];      // sorted list of unique group names
    let activeGroups = new Set(); // groups currently visible

    // ── Render Dashboard (called once after data fetch) ─────
    function renderDashboard(guests) {
      allGuests = guests;

      document.getElementById('last-updated').textContent =
        'Last refreshed: ' + new Date().toLocaleString();

      // Extract all unique groups (preserve sheet order, then de-dupe)
      const seen = new Set();
      allGroups = [];
      for (const g of guests) {
        const grp = getField(g, 'group') || 'Uncategorized';
        if (!seen.has(grp)) { seen.add(grp); allGroups.push(grp); }
      }
      activeGroups = new Set(allGroups); // all on by default

      buildGroupFilter();
      renderCards();

      // Show tab bar and wire tab buttons (once)
      const tabBar = document.getElementById('view-tab-bar');
      tabBar.style.display = 'block';
      tabBar.querySelectorAll('.view-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          tabBar.querySelectorAll('.view-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const view = btn.dataset.view;
          document.getElementById('rsvp-panel').classList.toggle('active', view === 'rsvp');
          document.getElementById('accommodations-panel').classList.toggle('active', view === 'accommodations');
        });
      });

      document.getElementById('search-section').style.display = 'block';
      attachSearch();
    }

    // ── Build Group Filter Bar ────────────────────────────────
    function buildGroupFilter() {
      const bar = document.getElementById('group-filter-bar');
      if (allGroups.length === 0) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';

      const pills = allGroups.map(grp => {
        const active = activeGroups.has(grp) ? 'active' : '';
        return `<button class="gf-pill ${active}" data-group="${escapeHtml(grp)}">${escapeHtml(grp)}</button>`;
      }).join('');

      bar.innerHTML = `
        <div class="gf-label">Filter by Group</div>
        <div class="gf-pills">
          <button class="gf-pill gf-all active" id="gf-all">All Groups</button>
          ${pills}
        </div>`;

      // Wire up pill clicks
      bar.querySelectorAll('.gf-pill[data-group]').forEach(btn => {
        btn.addEventListener('click', () => {
          const grp = btn.dataset.group;
          if (activeGroups.has(grp)) {
            activeGroups.delete(grp);
            btn.classList.remove('active');
          } else {
            activeGroups.add(grp);
            btn.classList.add('active');
          }
          // Update "All Groups" pill
          const allBtn = document.getElementById('gf-all');
          allBtn.classList.toggle('active', activeGroups.size === allGroups.length);
          renderCards();
        });
      });

      document.getElementById('gf-all').addEventListener('click', () => {
        const allOn = activeGroups.size === allGroups.length;
        if (allOn) {
          // Turn all off (keep at least one)
          activeGroups.clear();
        } else {
          allGroups.forEach(g => activeGroups.add(g));
        }
        bar.querySelectorAll('.gf-pill').forEach(b => {
          b.classList.toggle('active', activeGroups.size === allGroups.length);
        });
        bar.querySelectorAll('.gf-pill[data-group]').forEach(b => {
          b.classList.toggle('active', activeGroups.has(b.dataset.group));
        });
        renderCards();
      });
    }

    // ── Render Cards (called whenever filter changes) ────────
    function renderCards() {
      const filtered = allGuests.filter(g => {
        const grp = getField(g, 'group') || 'Uncategorized';
        return activeGroups.has(grp);
      });

      // ── RSVP tab ──
      let rsvpHtml = '';
      for (const event of EVENTS) {
        const agg = aggregateEvent(filtered, event);
        const totals = {
          invited:  agg.invited.length,
          accepted: agg.accepted.length,
          declined: agg.declined.length,
          awaiting: agg.awaiting.length,
        };
        rsvpHtml += buildCard(event.name, null, totals, agg, event.name.replace(/\s/g, '-'));
      }
      document.getElementById('cards-container').innerHTML = rsvpHtml;
      attachInteractions();

      // ── Accommodations tab ──
      let accomHtml = '';
      for (const event of EVENTS) {
        const agg = aggregateEvent(filtered, event);
        accomHtml += `
          <div class="accom-card">
            <div class="accom-card-title">${escapeHtml(event.name)}</div>
            ${buildAllergySection(agg.allergies)}
          </div>`;
      }
      accomHtml += buildSongRequestsSection(filtered);
      document.getElementById('accommodations-container').innerHTML = accomHtml;
    }

    // ── Song Requests Section ────────────────────────────────
    const SONG_IGNORE = new Set(['no', 'none', 'n/a', 'na', '-', '']);
    function buildSongRequestsSection(guests) {
      const requests = [];
      for (const g of guests) {
        const song = getField(g, 'song request', 'song requests', 'song', 'music request');
        if (!song || SONG_IGNORE.has(song.trim().toLowerCase())) continue;
        const name = g['display name'] || 'Unknown';
        const group = getField(g, 'group') || 'Uncategorized';
        requests.push({ name, song, group });
      }

      let body;
      if (requests.length === 0) {
        body = `<p class="allergy-none">No song requests submitted.</p>`;
      } else {
        // Sort by group then last name
        requests.sort((a, b) => {
          const gc = a.group.localeCompare(b.group);
          if (gc !== 0) return gc;
          return lastName(a.name).localeCompare(lastName(b.name));
        });
        const rows = requests.map(r => `
          <div class="song-row">
            <span class="song-guest-name">${escapeHtml(r.name)}</span>
            <span class="song-request-text">${escapeHtml(r.song)}</span>
          </div>`).join('');
        body = `<div class="song-list">${rows}</div>`;
      }

      return `
        <div class="song-section" style="margin-top:16px;">
          <div class="song-section-title">Song Requests</div>
          <div class="song-section-subtitle">${requests.length} request${requests.length !== 1 ? 's' : ''} • combined across all events</div>
          ${body}
        </div>`;
    }

    // ── Build Card HTML ─────────────────────────────────────
    function buildCard(title, subtitle, totals, names, idPrefix, isOverview = false) {
      const total = totals.invited;
      const accPct = total ? (totals.accepted / total * 100) : 0;
      const decPct = total ? (totals.declined / total * 100) : 0;
      const awaPct = total ? (totals.awaiting / total * 100) : 0;

      const cardClass = isOverview ? 'event-card overview-card' : 'event-card';
      const tagHtml = isOverview
        ? '<span class="event-label-tag">Combined</span>'
        : '';

      return `
        <div class="${cardClass}" id="card-${idPrefix}">
          <div class="event-card-header">
            <h2 class="event-name">${title}</h2>
            ${tagHtml}
          </div>

          <div class="stat-row">
            <div class="stat-chip" data-type="invited" data-card="${idPrefix}" data-list="invited" role="button" tabindex="0">
              <span class="stat-dot"></span>
              <span class="stat-count">${totals.invited}</span>
              <span class="stat-label">Invited</span>
            </div>
            <div class="stat-chip" data-type="accepted" data-card="${idPrefix}" data-list="accepted" role="button" tabindex="0">
              <span class="stat-dot"></span>
              <span class="stat-count">${totals.accepted} <span style="font-size: 0.85em; opacity: 0.8; font-weight: 400">(${accPct.toFixed(0)}%)</span></span>
              <span class="stat-label">Accepted</span>
            </div>
            <div class="stat-chip" data-type="declined" data-card="${idPrefix}" data-list="declined" role="button" tabindex="0">
              <span class="stat-dot"></span>
              <span class="stat-count">${totals.declined} <span style="font-size: 0.85em; opacity: 0.8; font-weight: 400">(${decPct.toFixed(0)}%)</span></span>
              <span class="stat-label">Declined</span>
            </div>
            <div class="stat-chip" data-type="awaiting" data-card="${idPrefix}" data-list="awaiting" role="button" tabindex="0">
              <span class="stat-dot"></span>
              <span class="stat-count">${totals.awaiting} <span style="font-size: 0.85em; opacity: 0.8; font-weight: 400">(${awaPct.toFixed(0)}%)</span></span>
              <span class="stat-label">Awaiting</span>
            </div>
          </div>

          <div class="thermo-wrap">
            <div class="thermo-bar">
              ${accPct > 0 ? `<div class="thermo-seg seg-accepted" style="flex:${accPct}" data-card="${idPrefix}" data-list="accepted" role="button" tabindex="0">
                ${accPct > 8 ? `<span class="thermo-seg-label">${totals.accepted}</span>` : ''}
              </div>` : ''}
              ${decPct > 0 ? `<div class="thermo-seg seg-declined" style="flex:${decPct}" data-card="${idPrefix}" data-list="declined" role="button" tabindex="0">
                ${decPct > 8 ? `<span class="thermo-seg-label">${totals.declined}</span>` : ''}
              </div>` : ''}
              ${awaPct > 0 ? `<div class="thermo-seg seg-awaiting" style="flex:${awaPct}" data-card="${idPrefix}" data-list="awaiting" role="button" tabindex="0">
                ${awaPct > 8 ? `<span class="thermo-seg-label">${totals.awaiting}</span>` : ''}
              </div>` : ''}
            </div>
          </div>

          <!-- Name lists (hidden until clicked) -->
          ${buildNameList(idPrefix, 'invited',  'Invited',           names.invited,  'var(--text-mid)')}
          ${buildNameList(idPrefix, 'accepted', 'Accepted',          names.accepted, 'var(--accepted)')}
          ${buildNameList(idPrefix, 'declined', 'Declined',          names.declined, 'var(--declined)')}
          ${buildNameList(idPrefix, 'awaiting', 'Awaiting Response', names.awaiting, 'var(--awaiting)')}
        </div>
      `;
    }

    // ── Allergy Section ───────────────────────────────────────
    // "No" filter: exact whole-string match only (so "no dairy" still shows)
    const DIET_IGNORE = new Set(['no', 'none', 'n/a', 'na', 'nope', '-']);
    function isDietIgnored(val) {
      return DIET_IGNORE.has((val || '').trim().toLowerCase());
    }

    function buildAllergySection(allergies) {
      // Nut allergy: only "yes" responses
      const nutGuests = (allergies || []).filter(a =>
        (a.nutAllergy || '').trim().toLowerCase() === 'yes'
      );

      // Dietary: non-empty AND not a "none/no/n/a" dismissal
      const dietGuests = (allergies || []).filter(a => {
        const v = (a.dietary || '').trim();
        return v.length > 0 && !isDietIgnored(v);
      });

      // Vegetarian count (case-insensitive substring)
      const vegCount = dietGuests.filter(a =>
        (a.dietary || '').toLowerCase().includes('vegetarian')
      ).length;

      // ── Nut Allergy sub-section ──
      let nutBody;
      if (nutGuests.length === 0) {
        nutBody = `<p class="allergy-none">No nut allergies among confirmed attendees.</p>`;
      } else {
        nutBody = `<div class="allergy-list">${
          nutGuests.map(a => `
            <div class="allergy-row">
              <span class="allergy-name">${escapeHtml(a.name)}</span>
              <span class="allergy-details"><span class="allergy-tag">Nut Allergy</span></span>
            </div>`).join('')
        }</div>`;
      }

      // ── Dietary Restrictions sub-section ──
      let dietBody;
      if (dietGuests.length === 0) {
        dietBody = `<p class="allergy-none">No dietary restrictions listed for confirmed attendees.</p>`;
      } else {
        const vegNote = vegCount > 0
          ? `<span class="allergy-count-tag" style="background:rgba(61,139,95,0.1);color:var(--accepted);margin-left:6px;">
              ${vegCount} vegetarian${vegCount !== 1 ? 's' : ''}
             </span>`
          : '';
        dietBody = `
          <div class="allergy-list">${
            dietGuests.map(a => `
              <div class="allergy-row">
                <span class="allergy-name">${escapeHtml(a.name)}</span>
                <span class="allergy-details">${escapeHtml(a.dietary)}</span>
              </div>`).join('')
          }</div>`;
        // attach veg note to the diet header (returned inline below)
        return `
          <div class="allergy-section">
            <div class="allergy-subsection">
              <div class="allergy-header">
                <span class="allergy-header-label">Nut Allergies</span>
                ${nutGuests.length > 0 ? `<span class="allergy-count-tag">${nutGuests.length} guest${nutGuests.length !== 1 ? 's' : ''}</span>` : ''}
              </div>
              ${nutBody}
            </div>
            <div class="allergy-subsection" style="margin-top:16px;">
              <div class="allergy-header">
                <span class="allergy-header-label">Dietary Restrictions</span>
                <span class="allergy-count-tag" style="background:rgba(212,168,67,0.12);color:var(--awaiting);">${dietGuests.length} guest${dietGuests.length !== 1 ? 's' : ''}</span>
                ${vegNote}
              </div>
              ${dietBody}
            </div>
          </div>`;
      }

      // No diet guests path — still render both sections
      return `
        <div class="allergy-section">
          <div class="allergy-subsection">
            <div class="allergy-header">
              <span class="allergy-header-label">Nut Allergies</span>
              ${nutGuests.length > 0 ? `<span class="allergy-count-tag">${nutGuests.length} guest${nutGuests.length !== 1 ? 's' : ''}</span>` : ''}
            </div>
            ${nutBody}
          </div>
          <div class="allergy-subsection" style="margin-top:16px;">
            <div class="allergy-header">
              <span class="allergy-header-label">Dietary Restrictions</span>
            </div>
            ${dietBody}
          </div>
        </div>
      `;
    }

    // ── Name list data store & sort state ──────────────────
    // key = `${cardId}-${type}`, value = [{name,status,idx,group}]
    const nameListStore = {};
    const sortState     = {}; // key → 'first' | 'last' | 'party'

    function nameStyle(status) {
      if (status === 'accepted') return 'color:var(--accepted);font-weight:400;';
      if (status === 'declined') return 'color:var(--declined);font-weight:400;';
      if (status === 'awaiting') return 'color:var(--awaiting);font-weight:600;';
      return '';
    }

    function lastName(displayName) {
      const parts = displayName.trim().split(/\s+/);
      return parts[parts.length - 1];
    }

    // Render names grouped by group, sorted within each group
    function renderGroupedNames(items, sort) {
      // Sort within each future group
      const sorted = [...items];
      if (sort === 'first') {
        sorted.sort((a, b) => a.name.localeCompare(b.name));
      } else if (sort === 'last') {
        sorted.sort((a, b) => lastName(a.name).localeCompare(lastName(b.name)));
      } else {
        sorted.sort((a, b) => a.idx - b.idx);
      }

      // Group preserving sorted order
      const groups = [];
      const groupMap = new Map();
      for (const item of sorted) {
        const g = item.group || 'Uncategorized';
        if (!groupMap.has(g)) { groupMap.set(g, []); groups.push(g); }
        groupMap.get(g).push(item);
      }

      let html = '';
      for (const grp of groups) {
        const members = groupMap.get(grp);
        html += `<span class="group-header">${escapeHtml(grp)} (${members.length})</span>`;
        for (const item of members) {
          html += `<span class="name-tag" style="${nameStyle(item.status)}">${item.name}</span>`;
        }
      }
      return html;
    }

    function renderSortedNames(key) {
      const items = nameListStore[key] || [];
      const sort  = sortState[key] || 'last';
      const listEl = document.querySelector(`#list-${key} .name-list`);
      if (!listEl) return;
      listEl.innerHTML = renderGroupedNames(items, sort);
    }

    function buildNameList(cardId, type, label, items, dotColor) {
      if (!items || items.length === 0) return '';

      const key = `${cardId}-${type}`;
      nameListStore[key] = items;
      sortState[key] = 'last'; // default: last name

      const tags = renderGroupedNames(items, 'last');

      return `
        <div class="name-list-wrap" id="list-${key}">
          <div class="name-list-header" style="color: ${dotColor}">
            <span class="header-dot" style="background: ${dotColor}"></span>
            ${label} (${items.length})
          </div>
          <div class="sort-controls">
            <span class="sort-label">Sort:</span>
            <button class="sort-btn" data-list-key="${key}" data-sort="first">First Name</button>
            <button class="sort-btn active" data-list-key="${key}" data-sort="last">Last Name</button>
            <button class="sort-btn" data-list-key="${key}" data-sort="party">Party Order</button>
          </div>
          <div class="name-list">${tags}</div>
        </div>
      `;
    }

    // ── Click Interactions ───────────────────────────────────
    function attachInteractions() {
      // Stat chips and thermometer segments toggle name lists
      document.querySelectorAll('.stat-chip, .thermo-seg').forEach(el => {
        const handler = () => {
          const cardId   = el.dataset.card;
          const listType = el.dataset.list;
          const listKey  = `${cardId}-${listType}`;
          const listWrap = document.getElementById(`list-${listKey}`);
          if (!listWrap) return;

          const isOpen = listWrap.classList.contains('open');

          // Close all lists in this card
          const card = document.getElementById(`card-${cardId}`);
          card.querySelectorAll('.name-list-wrap.open').forEach(w => w.classList.remove('open'));
          card.querySelectorAll('.stat-chip.active').forEach(c => c.classList.remove('active'));

          // Toggle this one
          if (!isOpen) {
            listWrap.classList.add('open');
            el.classList.add('active');
            card.querySelectorAll(`[data-list="${listType}"][data-card="${cardId}"]`).forEach(s => {
              s.classList.add('active');
            });
          }
        };

        el.addEventListener('click', handler);
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            handler();
          }
        });
      });

      // Sort buttons
      document.querySelectorAll('.sort-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation(); // don't close the list
          const key  = btn.dataset.listKey;
          const sort = btn.dataset.sort;
          sortState[key] = sort;

          // Update active state on sibling buttons
          btn.closest('.sort-controls').querySelectorAll('.sort-btn').forEach(b => {
            b.classList.toggle('active', b === btn);
          });

          renderSortedNames(key);
        });
      });
    }

    // ── Person Search ────────────────────────────────────────
    function attachSearch() {
      const input = document.getElementById('person-search');
      const resultsEl = document.getElementById('search-results');

      input.addEventListener('input', () => {
        const query = input.value.trim().toLowerCase();
        resultsEl.innerHTML = '';
        if (!query) return;

        // Find all guests whose display name matches
        const matches = allGuests.filter(g =>
          (g['display name'] || '').toLowerCase().includes(query)
        );

        if (matches.length === 0) {
          resultsEl.innerHTML = `<p class="search-no-results">No guests found matching "${escapeHtml(input.value.trim())}"</p>`;
          return;
        }

        // Group matched guests + their party members by party
        const seenParties = new Set();
        matches.forEach(g => {
          const party = g['Party'] || g['party'] || '';
          if (seenParties.has(party)) return;
          seenParties.add(party);

          // Collect all guests in the same party
          const partyMembers = party
            ? allGuests.filter(p => (p['Party'] || p['party'] || '') === party)
            : [g];  // no party field — just show the single guest

          resultsEl.appendChild(buildPartyCard(partyMembers, party));
        });
      });
    }

    function buildPartyCard(members, partyName) {
      const wrapper = document.createElement('div');
      wrapper.className = 'person-card';

      // Party label
      let html = '';
      if (partyName) {
        html += `<div class="person-card-party-label">${escapeHtml(partyName)}</div>`;
      }

      // Resolve display names
      const names = members.map(g =>
        g['display name'] || `${g['First Name'] || ''} ${g['Last Name'] || ''}`.trim() || 'Unknown'
      );

      // Build attendance table
      // Columns: event label | one column per member
      html += '<div class="attendance-scroll"><table class="attendance-table"><thead><tr>';
      html += '<th style="border-bottom:2px solid rgba(196,169,106,0.25);padding-bottom:12px;"></th>'; // empty corner
      names.forEach(n => {
        html += `<th class="att-name-header">${escapeHtml(n)}</th>`;
      });
      html += '</tr></thead><tbody>';

      EVENTS.forEach((ev, evIdx) => {
        const isLast = evIdx === EVENTS.length - 1;
        const rowClass = isLast ? 'last-row' : '';
        html += '<tr>';
        html += `<td class="att-event-cell ${rowClass}">${escapeHtml(ev.name)}</td>`;

        members.forEach(guest => {
          const inv = guest[ev.inviteCol];
          const res = guest[ev.responseCol];

          let iconClass, iconSvg;
          if (inv !== '1') {
            // Not invited — em dash
            iconClass = 'not-invited';
            iconSvg = `<svg width="10" height="2" viewBox="0 0 10 2" fill="none">
              <rect width="10" height="2" rx="1" fill="rgba(0,0,0,0.25)"/></svg>`;
          } else if (res === '1') {
            // Attending — checkmark
            iconClass = 'accepted';
            iconSvg = `<svg width="12" height="10" viewBox="0 0 12 10" fill="none">
              <polyline points="1,5 4.5,9 11,1" stroke="var(--accepted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
          } else if (res === '0') {
            // Declined — X
            iconClass = 'declined';
            iconSvg = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <line x1="1" y1="1" x2="9" y2="9" stroke="var(--declined)" stroke-width="2" stroke-linecap="round"/>
              <line x1="9" y1="1" x2="1" y2="9" stroke="var(--declined)" stroke-width="2" stroke-linecap="round"/></svg>`;
          } else {
            // Awaiting — question-mark dot (hourglass feel)
            iconClass = 'awaiting';
            iconSvg = `<svg width="10" height="10" viewBox="0 0 10 10" fill="none">
              <circle cx="5" cy="5" r="3" stroke="var(--awaiting)" stroke-width="1.8"/>
              <circle cx="5" cy="5" r="1" fill="var(--awaiting)"/></svg>`;
          }

          html += `<td class="att-cell ${rowClass}"><span class="att-icon ${iconClass}">${iconSvg}</span></td>`;
        });

        html += '</tr>';
      });

      html += '</tbody></table></div>';
      wrapper.innerHTML = html;
      return wrapper;
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
  </script>

</body>
